<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wendi Crush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;560;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <main class="app">
      <!-- Title -->
      <section id="screen-title" class="screen screen--title is-active">
        <p class="eyebrow">für wendi</p>
        <h1 class="brand">Wendi Crush</h1>
        <p class="tagline">Match Stickers. Crush Combos. Miau.</p>
        <button type="button" class="btn btn--primary" id="btn-start">Spielen</button>
        <p class="hint">Ziel: Punkte knacken bevor die Züge alle sind.</p>
      </section>

      <!-- Game -->
      <section id="screen-game" class="screen screen--game" hidden>
        <header class="hud">
          <div class="hud__brand">Wendi Crush</div>
          <div class="hud__stats">
            <div class="stat">
              <span class="stat__label">Score</span>
              <span class="stat__value" id="score">0</span>
            </div>
            <div class="stat">
              <span class="stat__label">Ziel</span>
              <span class="stat__value" id="target">800</span>
            </div>
            <div class="stat">
              <span class="stat__label">Züge</span>
              <span class="stat__value" id="moves">20</span>
            </div>
          </div>
        </header>

        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Wendi Crush Spielfeld"></div>
        </div>

        <footer class="game-footer">
          <button type="button" class="btn btn--ghost" id="btn-menu">Menü</button>
          <p class="tip" id="tip">Zwei benachbarte Steine tippen zum Tauschen.</p>
        </footer>
      </section>

      <!-- Overlay win/lose -->
      <div id="overlay" class="overlay" hidden>
        <div class="overlay__card">
          <p class="overlay__eyebrow" id="overlay-eyebrow">Level klar</p>
          <h2 class="overlay__title" id="overlay-title">Crush complete, Wendi.</h2>
          <p class="overlay__text" id="overlay-text">Die Katzen sind stolz.</p>
          <div class="overlay__actions">
            <button type="button" class="btn btn--primary" id="btn-again">Nochmal</button>
            <button type="button" class="btn btn--ghost" id="btn-home">Titel</button>
          </div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
