<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedrock Map Viewer — Test</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e94560;
      color: #fff;
    }
    .toggle-group { display: flex; gap: 6px; margin-left: auto; }
    .toggle-group button {
      padding: 6px 14px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #0f3460;
      color: #888;
      cursor: not-allowed;
      font-size: 0.85rem;
    }
    .toggle-group button.active {
      background: #533483;
      color: #ccc;
      border-color: #533483;
    }
    #map { height: calc(100vh - 49px); background: #0d1b2a; }
    .placeholder-overlay {
      position: fixed;
      inset: 49px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1000;
    }
    .placeholder-overlay p {
      background: rgba(0, 0, 0, 0.7);
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bedrock Map Viewer</h1>
    <span class="badge">TEST SCAFFOLD</span>
    <div class="toggle-group">
      <button class="active" disabled>Top-Down</button>
      <button disabled>Isometrisch</button>
    </div>
  </header>

  <div id="map"></div>

  <div class="placeholder-overlay">
    <p>
      Keine Funktion — nur UI-Gerüst.<br />
      Leaflet-Karte ohne Tiles / ohne Welt-Daten.
    </p>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    // Empty map — no tiles, no data
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: 0,
      maxZoom: 4,
      zoomControl: true
    });

    map.setView([128, 128], 0);
  </script>
</body>
</html>
